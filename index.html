<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Atto</title>
<style>
  :root { --bg: #ffffff; --ink: #1d1d1b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  canvas#scene {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: grab; z-index: 1;
  }
  canvas#scene.dragging { cursor: grabbing; }

  /* ---------- Testi ---------- */
  .txt {
    position: fixed; left: 0; right: 0; z-index: 2;
    pointer-events: none; color: var(--ink);
    font-size: clamp(7px, 0.8vw, 13px); line-height: 1.15;
    font-weight: 500; letter-spacing: -0.01em;
    padding: 20px 24px;
  }
  .txt.top { top: 0; }
  .txt.bottom { bottom: 0; }
  .txt p { display: flex; justify-content: space-between; gap: 1em; flex-wrap: nowrap; }
  .txt span { white-space: nowrap; }
  .mobile { display: none; }

  /* ---------- Intro ---------- */
  .txt.intro {
    inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    transition: opacity .6s ease;
    pointer-events: auto; cursor: pointer;
  }
  .txt.intro span {
    padding: 7px 12px;
    border: 1px solid var(--ink); border-radius: 999px;
  }
  .txt.intro.out { opacity: 0; }

  /* ---------- Parametri ---------- */
  #controls {
    position: fixed; right: 16px; bottom: 70px; z-index: 4;
    display: flex; align-items: center; gap: 8px;
  }
  #toggle {
    font: inherit; font-size: 13px; padding: 7px 12px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--ink); border-radius: 999px; cursor: pointer;
  }
  #toggle .burger { display: none; }
  #panel {
    position: fixed; right: 16px; bottom: 112px; z-index: 3;
    width: 230px; padding: 14px;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--ink); border-radius: 10px;
    font-size: 13px; display: grid; gap: 10px;
  }
  #panel.hidden { display: none; }
  #panel label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 8px; }
  #panel label .val { font-variant-numeric: tabular-nums; opacity: .7; }
  #panel input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--ink); }
  #panel input[type=color] {
    width: 36px; height: 24px; border: 1px solid var(--ink); border-radius: 4px;
    padding: 0; background: none; cursor: pointer;
  }
  #panel button {
    font: inherit; padding: 7px; cursor: pointer;
    background: var(--ink); color: var(--bg); border: none; border-radius: 6px;
  }

  @media (max-width: 700px) {
    .desktop { display: none; }
    .mobile { display: block; }
    .txt { font-size: 8.5px; padding: 16px; }
    #controls { bottom: auto; top: 50%; transform: translateY(-50%); right: 12px; }
    /* Menù ad hamburger */
    #toggle { width: 40px; height: 40px; padding: 0; display: grid; place-items: center; }
    #toggle .lbl { display: none; }
    #toggle .burger { display: block; position: relative; width: 16px; height: 12px; }
    #toggle .burger i {
      position: absolute; left: 0; width: 100%; height: 1.5px; background: var(--ink);
      transition: transform .25s ease, opacity .2s ease, top .25s ease;
    }
    #toggle .burger i:nth-child(1) { top: 0; }
    #toggle .burger i:nth-child(2) { top: 5.25px; }
    #toggle .burger i:nth-child(3) { top: 10.5px; }
    #toggle[aria-expanded="true"] .burger i:nth-child(1) { top: 5.25px; transform: rotate(45deg); }
    #toggle[aria-expanded="true"] .burger i:nth-child(2) { opacity: 0; }
    #toggle[aria-expanded="true"] .burger i:nth-child(3) { top: 5.25px; transform: rotate(-45deg); }
    #panel { bottom: auto; top: 50%; right: 12px; width: min(240px, calc(100vw - 24px)); margin-top: 52px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<!-- Intro -->
<div class="txt intro" id="intro"><span>tap</span></div>

<!-- Desktop -->
<div class="txt top desktop" id="topD">
  <p><span>Vittorio Cavallini</span><span>Davide Daninos</span><span>Andrea Kvas</span><span>Nicola Martini</span><span>Jacopo Menzani</span><span>Luigi Presicce</span></p>
</div>
<div class="txt bottom desktop" id="botD">
  <p><span>6.11.26</span><span>Bagasseria</span><span>Vía dell’Agnolo 25/R</span><span>Firenze</span></p>
</div>

<!-- Mobile -->
<div class="txt top mobile" id="topM">
  <p><span>Vittorio Cavallini</span><span>Davide Daninos</span></p>
  <p><span>Andrea Kvas</span><span>Nicola Martini</span></p>
  <p><span>Jacopo Menzani</span><span>Luigi Presicce</span></p>
</div>
<div class="txt bottom mobile" id="botM">
  <p><span>6.11.26</span><span>Bagasseria</span></p>
  <p><span>Vía dell’Agnolo 25/R</span><span>Firenze</span></p>
</div>

<!-- Parametri -->
<div id="controls">
  <button id="toggle" aria-expanded="false" aria-label="Parametri">
    <span class="lbl">Parametri</span>
    <span class="burger"><i></i><i></i><i></i></span>
  </button>
</div>
<div id="panel" class="hidden">
  <button id="reset">Reset</button>
  <label>Colore fondo <input type="color" id="bgColor" value="#ffffff"></label>
  <label>Colore elementi <input type="color" id="inkColor" value="#1d1d1b"></label>
  <label>Velocità <span class="val" id="speedVal">1.0</span>
    <input type="range" id="speed" min="0.1" max="3" step="0.1" value="1"></label>
  <label>Gravità <span class="val" id="gravVal">0</span>
    <input type="range" id="gravity" min="-1" max="2" step="0.05" value="0"></label>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(() => {
  const { Engine, Runner, Bodies, Body, Composite, Vertices, Mouse, MouseConstraint, Events } = Matter;

  /* ---------- Geometria da atto.svg (viewBox 0 0 879 1080) ---------- */
  const rect = (x, y, w, h) => [x, y, x + w, y, x + w, y + h, x, y + h];
  // Ogni elemento = un gruppo del file SVG (le forme concave sono divise in parti convesse)
  const ELEMENTS = [
    [rect(160.7, 66.6, 138, 294.8), [365.9,247.7, 376.2,361.4, 61.8,361.4, 51.4,247.7]],
    [[298.7,66.6, 436.7,66.6, 655.3,361.4, 517.3,361.4], [754.3,361.4, 680.3,247.7, 365.9,247.7, 439.8,361.4]],
    [rect(580.9, 392.9, 138, 294.8), [513.8,506.6, 503.5,392.9, 817.9,392.9, 828.2,506.6]],
    [[580.9,687.8, 442.9,687.8, 224.4,392.9, 362.4,392.9], [125.4,392.9, 199.3,506.6, 513.8,506.6, 439.8,392.9]],
    [rect(442.9, 719.3, 138, 147.4), [442.9,866.7, 580.9,866.7, 690.2,1014.1, 552.2,1014.1]],
    [[580.9,719.3, 718.9,719.3, 828.2,866.7, 690.2,866.7], rect(690.2, 866.7, 138, 147.4)]
  ];
  const BOX = { minX: 51.4, maxX: 828.2, minY: 66.6, maxY: 1014.1 };

  /* ---------- Setup ---------- */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  const engine = Engine.create({ enableSleeping: false, positionIterations: 10, velocityIterations: 8 });
  engine.gravity.y = 0;
  const runner = Runner.create();

  let elements = [];
  let walls = [];
  let inkColor = '#1d1d1b';
  let bgColor = '#ffffff';

  const BODY_OPTS = { friction: 0.3, frictionAir: 0.025, restitution: 0.35, density: 0.002 };
  const visibleParts = b => (b.parts.length > 1 ? b.parts.slice(1) : b.parts);

  const isMobile = () => window.matchMedia('(max-width: 700px)').matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.setAttribute('data-pixel-ratio', dpr);
    mouse.pixelRatio = dpr;
    buildWalls();
  }

  function buildWalls() {
    if (walls.length) Composite.remove(engine.world, walls);
    const t = 400, o = { isStatic: true, friction: 0.3, restitution: 0.4 };
    walls = [
      Bodies.rectangle(W / 2, H + t / 2, W + 2 * t, t, o),
      Bodies.rectangle(W / 2, -t / 2, W + 2 * t, t, o),
      Bodies.rectangle(-t / 2, H / 2, t, H + 2 * t, o),
      Bodies.rectangle(W + t / 2, H / 2, t, H + 2 * t, o)
    ];
    Composite.add(engine.world, walls);
    // riporta dentro eventuali elementi rimasti fuori
    elements.forEach(b => {
      const x = Math.min(Math.max(b.position.x, 20), W - 20);
      const y = Math.min(Math.max(b.position.y, 20), H - 20);
      if (x !== b.position.x || y !== b.position.y) Body.setPosition(b, { x, y });
    });
  }

  function textBlockHeight(id) {
    const el = document.getElementById(id);
    return el ? el.getBoundingClientRect().height : 0;
  }

  function buildElements() {
    if (elements.length) Composite.remove(engine.world, elements);
    const mob = isMobile();
    const top = textBlockHeight(mob ? 'topM' : 'topD');
    const bot = textBlockHeight(mob ? 'botM' : 'botD');
    const availW = W - 32;
    const availH = H - top - bot - 24;
    const bw = BOX.maxX - BOX.minX, bh = BOX.maxY - BOX.minY;
    const s = Math.min(availW * (mob ? 0.9 : 0.85) / bw, availH * 0.9 / bh);
    const ox = W / 2 - (BOX.minX + bw / 2) * s;
    const oy = top + 12 + availH / 2 - (BOX.minY + bh / 2) * s;

    elements = ELEMENTS.map(group => {
      const parts = group.map(pts => {
        const v = [];
        for (let i = 0; i < pts.length; i += 2) v.push({ x: pts[i] * s + ox, y: pts[i + 1] * s + oy });
        const sorted = Vertices.clockwiseSort(v);
        return Body.create({ position: Vertices.centre(sorted), vertices: sorted });
      });
      return Body.create({ ...BODY_OPTS, parts });
    });
    Composite.add(engine.world, elements);
  }

  /* ---------- Mouse / touch ---------- */
  const mouse = Mouse.create(canvas);
  const mc = MouseConstraint.create(engine, {
    mouse,
    constraint: { stiffness: 0.2, damping: 0.1, render: { visible: false } }
  });
  Composite.add(engine.world, mc);
  /* ---------- Click / tap = esplosione in 3 pezzi ---------- */
  const TAP_TIME = 250;   // ms
  const TAP_DIST = 8;     // px
  const MIN_AREA = 25;    // px² minimi per frammento
  const FRAGMENTS = 15;   // frammenti per esplosione
  const BLAST_MIN = 9, BLAST_MAX = 16; // velocità di uscita dei frammenti
  let press = null;
  const toExplode = [];

  Events.on(mc, 'startdrag', e => {
    canvas.classList.add('dragging');
    press = { body: e.body, t: performance.now(), x: mouse.position.x, y: mouse.position.y };
  });
  Events.on(mc, 'enddrag', e => {
    canvas.classList.remove('dragging');
    if (press && press.body === e.body) {
      const dt = performance.now() - press.t;
      const dd = Math.hypot(mouse.position.x - press.x, mouse.position.y - press.y);
      if (dt < TAP_TIME && dd < TAP_DIST) toExplode.push(e.body);
    }
    press = null;
  });
  Events.on(engine, 'afterUpdate', () => {
    while (toExplode.length) explode(toExplode.shift());
  });

  const cross = (a, b) => a.x * b.y - a.y * b.x;
  const polyArea = v => {
    let a = 0;
    for (let i = 0; i < v.length; i++) a += cross(v[i], v[(i + 1) % v.length]);
    return Math.abs(a) / 2;
  };
  // Sutherland–Hodgman: tiene i punti con f(p) >= 0
  function clip(poly, f) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length];
      const fa = f(a), fb = f(b);
      if (fa >= 0) out.push(a);
      if ((fa >= 0) !== (fb >= 0)) {
        const t = fa / (fa - fb);
        out.push({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
      }
    }
    return out;
  }

  function makeBody(polys) {
    const parts = polys.map(v => {
      const sorted = Vertices.clockwiseSort(v.map(p => ({ x: p.x, y: p.y })));
      return Body.create({ position: Vertices.centre(sorted), vertices: sorted });
    });
    if (parts.length === 1) {
      const p = parts[0];
      return Body.create({ ...BODY_OPTS, position: { ...p.position }, vertices: p.vertices.map(v => ({ x: v.x, y: v.y })) });
    }
    return Body.create({ ...BODY_OPTS, parts });
  }

  // punto dentro un poligono convesso
  function inConvex(p, v) {
    let sign = 0;
    for (let i = 0; i < v.length; i++) {
      const c = cross({ x: v[(i + 1) % v.length].x - v[i].x, y: v[(i + 1) % v.length].y - v[i].y },
                      { x: p.x - v[i].x, y: p.y - v[i].y });
      if (c !== 0) {
        if (sign === 0) sign = Math.sign(c);
        else if (Math.sign(c) !== sign) return false;
      }
    }
    return true;
  }

  // Esplosione in N frammenti (celle di Voronoi con semi casuali dentro la forma)
  function explode(body) {
    if (!elements.includes(body)) return;
    const polys = visibleParts(body).map(p => p.vertices.map(v => ({ x: v.x, y: v.y })));
    const total = polys.reduce((s, v) => s + polyArea(v), 0);
    if (total < MIN_AREA * FRAGMENTS) return;

    // semi casuali dentro la forma
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    polys.flat().forEach(p => {
      minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
      minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
    });
    const seeds = [];
    for (let tries = 0; seeds.length < FRAGMENTS && tries < 5000; tries++) {
      const p = { x: minX + Math.random() * (maxX - minX), y: minY + Math.random() * (maxY - minY) };
      if (polys.some(v => inConvex(p, v))) seeds.push(p);
    }
    if (seeds.length < 2) return;

    const pieces = [];
    seeds.forEach((si, i) => {
      let cell = polys;
      seeds.forEach((sj, j) => {
        if (i === j) return;
        const mx = (si.x + sj.x) / 2, my = (si.y + sj.y) / 2;
        const nx = si.x - sj.x, ny = si.y - sj.y;
        const f = p => (p.x - mx) * nx + (p.y - my) * ny;
        cell = cell.map(v => clip(v, f)).filter(v => v.length >= 3);
      });
      cell = cell.filter(v => polyArea(v) > 1);
      if (cell.length) pieces.push(cell);
    });
    if (pieces.length < 2) return;

    Composite.remove(engine.world, body);
    elements = elements.filter(b => b !== body);
    const c = body.position, v = body.velocity;

    // onda d'urto: spinge anche gli elementi vicini
    const radius = Math.sqrt(total) * 2.5;
    elements.forEach(o => {
      const dx = o.position.x - c.x, dy = o.position.y - c.y;
      const d = Math.hypot(dx, dy);
      if (d > 1 && d < radius) {
        const k = (1 - d / radius) * BLAST_MIN * 0.6;
        Body.setVelocity(o, { x: o.velocity.x + dx / d * k, y: o.velocity.y + dy / d * k });
      }
    });

    pieces.forEach(pc => {
      const nb = makeBody(pc);
      let dx = nb.position.x - c.x, dy = nb.position.y - c.y;
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      const speed = BLAST_MIN + Math.random() * (BLAST_MAX - BLAST_MIN);
      Body.setVelocity(nb, { x: v.x + dx * speed, y: v.y + dy * speed });
      Body.setAngularVelocity(nb, (Math.random() - 0.5) * 0.5);
      elements.push(nb);
      Composite.add(engine.world, nb);
    });
  }
  // lascia scorrere la pagina normalmente (Matter blocca la rotella)
  if (mouse.mousewheel) {
    mouse.element.removeEventListener('wheel', mouse.mousewheel);
    mouse.element.removeEventListener('mousewheel', mouse.mousewheel);
    mouse.element.removeEventListener('DOMMouseScroll', mouse.mousewheel);
  }

  /* ---------- Render ---------- */
  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = 'round';
    ctx.fillStyle = inkColor;
    ctx.strokeStyle = inkColor;
    ctx.lineWidth = 0.8;
    for (const b of elements) {
      ctx.beginPath();
      const parts = b.parts.length > 1 ? b.parts.slice(1) : b.parts;
      for (const p of parts) {
        const v = p.vertices;
        ctx.moveTo(v[0].x, v[0].y);
        for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
        ctx.closePath();
      }
      ctx.fill('nonzero');
      ctx.stroke();
    }
    requestAnimationFrame(draw);
  }

  /* ---------- Controlli ---------- */
  const $ = id => document.getElementById(id);
  const panel = $('panel'), toggle = $('toggle');

  toggle.addEventListener('click', () => {
    const open = panel.classList.toggle('hidden') === false;
    toggle.setAttribute('aria-expanded', open);
  });

  $('reset').addEventListener('click', () => {
    buildElements();
  });

  $('bgColor').addEventListener('input', e => {
    bgColor = e.target.value;
    document.documentElement.style.setProperty('--bg', bgColor);
  });

  $('inkColor').addEventListener('input', e => {
    inkColor = e.target.value;
    document.documentElement.style.setProperty('--ink', inkColor);
  });

  $('speed').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    engine.timing.timeScale = v;
    $('speedVal').textContent = v.toFixed(1);
  });

  $('gravity').addEventListener('input', e => {
    const v = parseFloat(e.target.value);
    engine.gravity.y = v;
    $('gravVal').textContent = v.toFixed(2).replace(/0$/, '');
    elements.forEach(b => Matter.Sleeping.set(b, false));
  });

  // impedisce che lo scroll/zoom del browser interferisca su mobile
  document.addEventListener('touchmove', e => {
    if (e.target === canvas) e.preventDefault();
  }, { passive: false });

  /* ---------- Avvio ---------- */
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  const start = () => {
    resize();
    buildElements();
    Runner.run(runner, engine);
    requestAnimationFrame(draw);
  };

  // Intro: "tap" resta finché non si clicca, poi parte l'animazione dalla posizione iniziale
  const intro = document.getElementById('intro');
  let started = false;
  intro.addEventListener('click', () => {
    if (started) return;
    started = true;
    start();
    intro.classList.add('out');
    intro.addEventListener('transitionend', () => intro.remove(), { once: true });
  });
})();
</script>
</body>
</html>
